# Render Blueprint 配置
# 部署后请在 Render 控制台设置环境变量 MINIMAX_API_KEY（不要写进此文件）

services:
  - type: web
    name: fitlens-backend
    runtime: node
    plan: free
    region: singapore   # 新加坡，离中国较近
    rootDir: backend
    buildCommand: npm install
    startCommand: node src/index.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.0.0
      - key: MINIMAX_API_HOST
        value: https://api.minimaxi.com
      - key: MINIMAX_VISION_MODEL
        value: MiniMax-M3
      - key: CORS_ORIGIN
        value: "*"
      # MINIMAX_API_KEY 必须在 Render 控制台手动填入，不写这里
